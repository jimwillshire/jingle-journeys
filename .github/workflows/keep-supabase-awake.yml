# Pings Supabase every 3 days so the free project doesn't pause.
# If Supabase has paused (or the secrets are missing) the job fails and GitHub emails you.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 7 */3 * *"   # 07:17 UTC every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_KEY secret is missing."; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/scores?select=n&limit=1")
          echo "Supabase answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Not 200. Supabase may be paused: open supabase.com, pick the project, press Restore."
            exit 1
          fi
