# Wipes practice taps so the season starts afresh.
# Deletes every tap from before SEASON_START in config.js, so the job and the app always agree,
# and running it by hand later in December never touches real season scores.
# Runs by itself just after midnight on 1 December every year.
# Uses the same SUPABASE_URL and SUPABASE_KEY secrets as the keep-awake job.
name: Reset scores on 1 December

on:
  schedule:
    - cron: "5 0 1 12 *"   # 00:05 UTC on 1 December (00:05 UK time)
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type WIPE to delete every tap from before SEASON_START in config.js'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Get the app's files
        uses: actions/checkout@v4

      - name: Delete taps from before SEASON_START
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" != "WIPE" ]; then
            echo "Not confirmed (type WIPE). Nothing deleted."; exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_KEY secret is missing."; exit 1
          fi
          cutoff=$(grep -oE 'SEASON_START: *"[0-9]{4}-[0-9]{2}-[0-9]{2}"' config.js | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [ -z "$cutoff" ]; then
            echo "Couldn't find SEASON_START in config.js. Nothing deleted."; exit 1
          fi
          if [ "$EVENT" = "schedule" ] && [ "${cutoff:0:4}" != "$(TZ=Europe/London date +%Y)" ]; then
            echo "SEASON_START in config.js is $cutoff, which isn't this year. Nothing deleted."
            echo "Change SEASON_START to this year's 1 December, then run this job by hand (type WIPE)."
            exit 1
          fi
          auth=()
          case "$SUPABASE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_KEY");; esac
          code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 30 -X DELETE \
            -H "apikey: $SUPABASE_KEY" "${auth[@]}" -H "Prefer: return=minimal" \
            "${SUPABASE_URL%/}/rest/v1/taps?trip_date=lt.$cutoff")
          echo "Deleting taps before $cutoff: Supabase answered HTTP $code"
          cat /tmp/out; echo
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "Delete failed. Supabase may be paused: open supabase.com, pick the project, press Restore, then run this job by hand."
            exit 1
          fi
